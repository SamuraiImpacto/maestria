<!DOCTYPE html>
<html lang="pt-BR">
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>Teste a MaestrIA por 7 dias</title>
<script>
(function () {
  // Desde 25/11/2026 o teste tem uma página só: /teste/. Este endereço leva para ela com a área marcada,
  // mantendo a origem (?o=) de quem divulgou.
  var p = new URLSearchParams(location.search);
  if ("imobiliario") p.set("a", "imobiliario");
  var resto = p.toString();
  location.replace("/teste/" + (resto ? "?" + resto : ""));
})();
</script>
<noscript><meta http-equiv="refresh" content="0;url=/teste/?a=imobiliario"></noscript>
<p style="font-family:sans-serif;padding:24px">Abrindo o teste da MaestrIA. Se não abrir, <a href="/teste/?a=imobiliario">toque aqui</a>.</p>
</html>
