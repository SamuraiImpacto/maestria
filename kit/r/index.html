<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>O seu escritório | Samurai do Jurídico</title>

<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&display=swap" rel="stylesheet">
<style>
:root { --bg:#000; --card:#0b0b0b; --card2:#141414; --txt:#fff; --muted:#bdbdbd; --dim:#7f7f7f;
  --red:#ef2727; --red2:#ff5d5d; --redbg:rgba(239,39,39,.08); --redbd:rgba(239,39,39,.32);
  --cta:#14a44d; --cta2:#1cc25c; --ok:#4ade80; --bd:#1f1f1f; --bd2:#2c2c2c; --r:16px; --rs:10px;
  --zap:#0b141a; --zapin:#202c33; --zapout:#005c4b; }
* { box-sizing:border-box; margin:0; padding:0; }
[hidden] { display:none !important; }
html { scroll-behavior:smooth; }
body { background:var(--bg); color:var(--muted); font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; font-size:17px; line-height:1.6; -webkit-font-smoothing:antialiased; }
main { max-width:820px; margin:0 auto; padding:40px 16px 120px; display:flex; flex-direction:column; gap:72px; }
section { display:flex; flex-direction:column; gap:18px; }
.selo { align-self:flex-start; font-size:12.5px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:var(--red2); background:var(--redbg); border:1px solid var(--redbd); border-radius:999px; padding:6px 14px; }
h1 { font-family:'Playfair Display',serif; font-weight:900; color:var(--txt); font-size:clamp(34px,6.4vw,58px); line-height:1.08; text-wrap:balance; letter-spacing:-.01em; }
h1 em, h2 em { font-style:italic; color:var(--red2); }
h2 { font-family:'Playfair Display',serif; font-weight:900; color:var(--txt); font-size:clamp(26px,4.4vw,38px); line-height:1.15; text-wrap:balance; }
h3 { color:var(--txt); font-size:18px; font-weight:800; line-height:1.3; }
.sub { font-size:19px; max-width:60ch; }
.sub b, p b { color:var(--txt); }
.olho { font-size:13px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); }
.faca { font-family:'Playfair Display',serif; font-style:italic; font-weight:700; color:var(--txt); font-size:clamp(22px,3.6vw,30px); line-height:1.25; border-left:3px solid var(--red); padding:4px 0 4px 18px; text-wrap:balance; }
.cascata { display:flex; flex-direction:column; gap:4px; color:var(--txt); font-size:20px; font-weight:600; }
.botao { display:inline-flex; align-items:center; justify-content:center; gap:10px; font-family:inherit; font-weight:800; font-size:16px; color:#fff; background:var(--cta); border:0; border-radius:var(--rs); padding:14px 22px; cursor:pointer; text-decoration:none; transition:background .15s, transform .15s; }
.botao:hover { background:var(--cta2); transform:translateY(-1px); }
.botao:focus-visible, a:focus-visible { outline:3px solid var(--ok); outline-offset:3px; }
.botao.grande { font-size:18px; padding:18px 28px; width:100%; }
.botao.copiado { background:var(--card2); color:var(--ok); }
.nota { font-size:14px; color:var(--dim); }
.hero { gap:22px; padding-top:8px; }
.hero .acoes { display:flex; flex-wrap:wrap; gap:12px 18px; align-items:center; }
.zap { background:var(--zap); border:1px solid var(--bd2); border-radius:22px; padding:16px; display:flex; flex-direction:column; gap:10px; max-width:440px; width:100%; }
.zap .topo { display:flex; align-items:center; gap:10px; padding-bottom:10px; border-bottom:1px solid #1e2a30; color:var(--txt); font-weight:700; font-size:15px; }
.zap .topo i { width:34px; height:34px; border-radius:50%; background:#2a3942; display:inline-block; }
.zap .topo small { display:block; color:#8696a0; font-weight:500; font-size:12.5px; }
.bolha { max-width:86%; padding:9px 12px 7px; border-radius:12px; font-size:15px; line-height:1.45; color:#e9edef; }
.bolha.in { background:var(--zapin); align-self:flex-start; border-top-left-radius:4px; }
.bolha.out { background:var(--zapout); align-self:flex-end; border-top-right-radius:4px; }
.bolha .h { display:block; text-align:right; font-size:11.5px; color:#8696a0; margin-top:2px; }
.duo { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); }
.lado { background:var(--card); border:1px solid var(--bd); border-radius:var(--r); padding:20px; display:flex; flex-direction:column; gap:12px; }
.lado.ruim { border-color:var(--redbd); }
.lado.bom { border-color:rgba(74,222,128,.35); }
.lado .tag { font-size:12px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; }
.lado.ruim .tag { color:var(--red2); }
.lado.bom .tag { color:var(--ok); }
.digitado { font-family:ui-monospace,'SFMono-Regular',Consolas,monospace; font-size:14px; color:var(--txt); background:var(--card2); border-radius:var(--rs); padding:12px; white-space:pre-wrap; }
.volta { font-size:15px; color:var(--muted); white-space:pre-line; }
.grade { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); }
.cartao { background:var(--card); border:1px solid var(--bd); border-radius:var(--r); padding:20px; display:flex; flex-direction:column; gap:8px; }
.cartao .num { font-family:'Playfair Display',serif; font-weight:900; font-size:44px; line-height:1; color:var(--red2); font-variant-numeric:tabular-nums; }
.indice { list-style:none; display:grid; gap:8px; grid-template-columns:minmax(0,1fr); }
.indice li { display:flex; }
.indice a { flex:1; }
.indice a { display:flex; gap:12px; align-items:baseline; color:var(--txt); text-decoration:none; background:var(--card); border:1px solid var(--bd); border-radius:var(--rs); padding:12px 14px; font-size:15.5px; transition:border-color .15s; }
.indice a:hover { border-color:var(--bd2); background:var(--card2); }
.indice a b { color:var(--red2); font-variant-numeric:tabular-nums; min-width:22px; }
.indice a span { display:block; color:var(--dim); font-size:13.5px; }
.item { gap:14px; scroll-margin-top:16px; }
.quando { color:var(--txt); }
.quando b { color:var(--ok); }
.caixa { background:var(--card); border:1px solid var(--bd2); border-radius:var(--r); overflow:hidden; }
.barra { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; border-bottom:1px solid var(--bd); flex-wrap:wrap; }
.barra span { font-size:12.5px; font-weight:700; color:var(--dim); letter-spacing:.08em; text-transform:uppercase; }
.prompt { max-height:300px; overflow:auto; padding:18px 16px; font-family:ui-monospace,'SFMono-Regular',Consolas,monospace; font-size:13.5px; line-height:1.6; color:var(--muted); white-space:pre-wrap; word-break:break-word; }
.lista { list-style:none; display:grid; gap:10px; }
.lista li { position:relative; padding-left:28px; color:var(--txt); }
.lista li::before { content:''; position:absolute; left:4px; top:.58em; width:9px; height:9px; border-radius:50%; background:var(--ok); }
.lista.nao li::before { background:var(--red); border-radius:2px; }
.cuidado { background:var(--redbg); border:1px solid var(--redbd); border-radius:var(--r); padding:20px; color:var(--txt); gap:6px; }
.cuidado strong { color:var(--red2); font-size:12.5px; letter-spacing:.09em; text-transform:uppercase; }
.oferta { background:var(--card2); border:1px solid var(--bd2); border-radius:22px; padding:30px 22px; gap:16px; }
.oferta .preco { font-family:'Playfair Display',serif; font-weight:900; color:var(--txt); font-size:64px; line-height:1; font-variant-numeric:tabular-nums; }
.oferta .preco small { display:block; font-family:'Inter',sans-serif; font-size:15px; font-weight:600; color:var(--dim); margin-top:10px; letter-spacing:.02em; }
.tira { display:flex; flex-wrap:wrap; gap:8px; }
.tira span { font-size:13.5px; color:var(--txt); background:var(--card); border:1px solid var(--bd2); border-radius:999px; padding:6px 12px; }
details { background:var(--card); border:1px solid var(--bd); border-radius:var(--rs); padding:14px 16px; }
details summary { cursor:pointer; color:var(--txt); font-weight:700; list-style:none; display:flex; justify-content:space-between; gap:12px; }
details summary::after { content:'+'; color:var(--red2); font-weight:800; }
details[open] summary::after { content:'\2212'; }
details p { margin-top:10px; }
.fixo { position:fixed; left:0; right:0; bottom:0; padding:10px 16px calc(10px + env(safe-area-inset-bottom)); background:rgba(0,0,0,.92); border-top:1px solid var(--bd2); display:none; z-index:5; }
.fixo .botao { width:100%; }
footer { border-top:1px solid var(--bd); padding-top:24px; font-size:13.5px; color:var(--dim); }
@media (max-width:700px) { .fixo { display:block; } body { font-size:16.5px; } .sub { font-size:17.5px; } }
@media (min-width:701px) {
  main { max-width:960px; }
  section { align-items:center; text-align:center; }
  section > h1, section > h2 { max-width:800px; }
  section > p, .sub { max-width:640px; }
  .selo, .olho { align-self:center; }
  .hero { padding-top:32px; }
  .hero .acoes { justify-content:center; }
  .faca { border-left:0; padding:18px 0 0; position:relative; max-width:640px; }
  .faca::before { content:''; position:absolute; top:0; left:50%; width:48px; height:3px; margin-left:-24px; background:var(--red); }
  .cascata { align-items:center; }
  .duo, .grade, .indice, .caixa, details, .item, .tira { width:100%; }
  .duo, .grade, .indice, .caixa, details, .cuidado, .lado, .cartao { text-align:left; }
  section > .lista { align-self:center; text-align:left; max-width:620px; }
  .tira { justify-content:center; }
  /* Prompt, aviso e oferta na mesma coluna, centralizada */
  .item, .cuidado, .oferta, .indice, .grade { align-self:center; width:100%; max-width:820px; }
  .indice, .grade { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .item { align-items:stretch; text-align:left; }
  .item > .olho { align-self:flex-start; }
  .oferta .botao.grande { max-width:420px; }
}
@media (prefers-reduced-motion:reduce) { * { transition:none !important; scroll-behavior:auto !important; } }

@media print {
  :root { --bg:#fff; --card:#fff; --card2:#f4f4f4; --txt:#111; --dim:#444; --bd:#ccc; --bd2:#ccc; }
  body { background:#fff !important; color:#111 !important; }
  #nav, .fixo, button, .botao { display:none !important; }
  section, .cartao, details { break-inside:avoid-page; }
}
.form { display:flex; flex-direction:column; gap:14px; width:100%; max-width:520px; background:var(--card); border:1px solid var(--bd2); border-radius:var(--r); padding:24px 20px; text-align:left; }
.form label { display:flex; flex-direction:column; gap:6px; color:var(--txt); font-weight:700; font-size:15px; }
.form label span { font-weight:500; color:var(--dim); font-size:13.5px; }
.form input, .form select { font:inherit; font-size:16px; color:var(--txt); background:var(--card2); border:1px solid var(--bd2); border-radius:var(--rs); padding:12px 14px; width:100%; }
.form input:focus, .form select:focus { outline:2px solid var(--ok); outline-offset:1px; }
.erro { color:var(--red2); font-weight:700; font-size:15px; min-height:1px; }
.etapas { list-style:none; display:flex; flex-direction:column; gap:12px; width:100%; max-width:520px; text-align:left; }
.etapas li { display:flex; gap:12px; align-items:center; color:var(--dim); font-size:16px; transition:color .3s; }
.etapas li i { width:22px; height:22px; border-radius:50%; border:2px solid var(--bd2); flex:none; display:flex; align-items:center; justify-content:center; font-style:normal; font-size:13px; }
.etapas li.ativa { color:var(--txt); font-weight:700; }
.etapas li.ativa i { border-color:var(--ok); border-top-color:transparent; animation:gira .9s linear infinite; }
.etapas li.feita { color:var(--txt); }
.etapas li.feita i { background:var(--ok); border-color:var(--ok); color:#000; }
.etapas li.feita i::after { content:'✓'; }
@keyframes gira { to { transform:rotate(360deg); } }
.barra-prog { width:100%; max-width:520px; height:8px; background:var(--card2); border-radius:99px; overflow:hidden; }
.barra-prog div { height:100%; width:0; background:var(--ok); transition:width .8s ease; }
.nav { position:sticky; top:0; z-index:4; display:flex; gap:6px; flex-wrap:wrap; justify-content:center; padding:10px 0; background:rgba(0,0,0,.92); border-bottom:1px solid var(--bd); }
.nav a { color:var(--txt); text-decoration:none; font-weight:700; font-size:14px; padding:7px 14px; border:1px solid var(--bd2); border-radius:99px; }
.nav a:hover { border-color:var(--ok); }
.placar { display:flex; gap:24px; align-items:center; justify-content:center; flex-wrap:wrap; }
.nota-grande { font-family:'Playfair Display',serif; font-weight:900; font-size:96px; line-height:1; color:var(--txt); font-variant-numeric:tabular-nums; }
.nota-grande small { font-size:28px; color:var(--dim); }
.barras { display:flex; flex-direction:column; gap:10px; min-width:240px; text-align:left; }
.barras div { display:grid; grid-template-columns:130px 1fr 34px; gap:10px; align-items:center; font-size:14px; color:var(--txt); }
.barras b { display:block; height:8px; border-radius:99px; background:var(--card2); overflow:hidden; }
.barras b span { display:block; height:100%; background:var(--red2); }
.barras em { font-style:normal; color:var(--dim); font-variant-numeric:tabular-nums; text-align:right; }
.leitura { display:flex; flex-direction:column; gap:12px; max-width:680px; text-align:left; }
.chip { display:inline-block; font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; border-radius:99px; padding:3px 10px; }
.chip.Urgente { background:var(--redbg); color:var(--red2); border:1px solid var(--redbd); }
.chip.Importante { background:rgba(250,204,21,.08); color:#facc15; border:1px solid rgba(250,204,21,.3); }
.chip.Melhoria { background:rgba(74,222,128,.08); color:var(--ok); border:1px solid rgba(74,222,128,.3); }
.texto-pre { white-space:pre-line; color:var(--txt); }
.roteiro b, .msg b { color:var(--txt); }
.filtros { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
.filtros button { font:inherit; font-weight:700; font-size:14px; color:var(--txt); background:var(--card); border:1px solid var(--bd2); border-radius:99px; padding:7px 14px; cursor:pointer; }
.filtros button[aria-pressed="true"] { background:var(--txt); color:#000; }
.copiar-s { font:inherit; font-weight:700; font-size:13px; color:var(--txt); background:var(--card2); border:1px solid var(--bd2); border-radius:8px; padding:6px 12px; cursor:pointer; align-self:flex-start; }
.copiar-s:hover { border-color:var(--ok); }
.aviso-ia { font-size:14px; color:var(--dim); max-width:680px; }
</style>
<script src="/js/pixel.js" defer></script>

<body>
<div class="nav" id="nav" hidden><a href="#raio-x">Raio-x</a><a href="#roteiros">30 roteiros</a><a href="#vendas">Vendas</a><a href="#trafego">Tráfego</a><a href="#bonus">Bônus</a></div>
<main id="app">
  <section class="hero" id="carregando"><span class="selo">Carregando</span><h1>Abrindo o seu escritório...</h1></section>
</main>
<script>
var API = 'https://xiwjtgyidguhvwpveokz.supabase.co/functions/v1/funil-kit';
function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function copiarTexto(botao, texto) {
  function ok() { var o = botao.textContent; botao.textContent = 'Copiado'; setTimeout(function () { botao.textContent = o; }, 2000); }
  function reserva() {
    var a = document.createElement('textarea'); a.value = texto; a.setAttribute('readonly', ''); a.style.position = 'fixed'; a.style.opacity = '0';
    document.body.appendChild(a); a.select(); try { document.execCommand('copy'); ok(); } catch (e) { botao.textContent = 'Selecione e copie'; } document.body.removeChild(a);
  }
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(texto).then(ok, reserva); else reserva();
}
function guardar(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function ler(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

(function () {
  var t = new URLSearchParams(location.search).get('t') || ler('escritorio_t');
  var app = document.getElementById('app');
  if (!t) { location.href = '/kit/comecar/'; return; }
  fetch(API + '?acao=status&t=' + encodeURIComponent(t)).then(function (r) { return r.json(); }).then(function (s) {
    if (s.estado !== 'pronto') { location.href = '/kit/comecar/?t=' + encodeURIComponent(t); return; }
    guardar('escritorio_t', t);
    montar(s);
  }).catch(function () { document.getElementById('carregando').querySelector('h1').textContent = 'Não consegui abrir agora. Recarregue a página.'; });

  function secao(id, olho, titulo, apoio) {
    var s = el('section'); s.id = id;
    s.appendChild(el('p', 'olho', olho)); s.appendChild(el('h2', null, titulo));
    if (apoio) s.appendChild(el('p', null, apoio));
    app.appendChild(s); return s;
  }
  function botaoCopiar(texto, rotulo) {
    var b = el('button', 'copiar-s', rotulo || 'Copiar'); b.type = 'button';
    b.addEventListener('click', function () { copiarTexto(b, texto); }); return b;
  }
  function cartao(pai) { var c = el('div', 'cartao'); pai.appendChild(c); return c; }

  function montar(s) {
    var r = s.resultado, x = r.raio_x || {}, perfil = r.perfil || {};
    app.innerHTML = '';
    document.getElementById('nav').hidden = false;
    var h = el('section', 'hero');
    h.appendChild(el('span', 'selo', 'Feito para @' + (perfil.username || s.instagram)));
    var h1 = el('h1'); h1.appendChild(document.createTextNode((s.nome ? s.nome + ', o seu' : 'O seu') + ' escritório está ')); h1.appendChild(el('em', null, 'pronto.')); h.appendChild(h1);
    h.appendChild(el('p', 'sub', 'Raio-x do seu Instagram, 30 roteiros de ' + (r.area || 'sua área') + ', as mensagens de venda do seu WhatsApp e a sua primeira campanha de tráfego. Salve este link: ele é seu.'));
    h.appendChild(el('p', 'aviso-ia', 'Feito por IA a partir do seu perfil público e da sua área. Leia e ajuste antes de publicar: a publicidade é sua, e a OAB (Provimento 205/2021) vale para cada post e anúncio.'));
    var pdf = el('button', 'botao', 'Baixar em PDF');
    pdf.type = 'button';
    pdf.addEventListener('click', function () {
      // Abre tudo que está fechado para o PDF sair completo.
      document.querySelectorAll('details').forEach(function (d) { d.open = true; });
      window.print();
    });
    h.appendChild(pdf);
    app.appendChild(h);

    // Raio-x
    var sx = secao('raio-x', 'Raio-x do perfil', 'Como o seu Instagram aparece hoje', null);
    if (perfil.lido === false) sx.appendChild(el('p', null, 'Não consegui ler o seu perfil: ele pode estar privado ou o @ não existe. O raio-x abaixo usa só a sua área.'));
    var placar = el('div', 'placar');
    var ng = el('div', 'nota-grande', String(x.score != null ? x.score : '?')); ng.appendChild(el('small', null, '/100')); placar.appendChild(ng);
    var barras = el('div', 'barras');
    var notas = x.notas || {}, pesos = { posicionamento: 35, bio: 25, feed: 25, engajamento: 15 };
    // Proteção: se a IA mandou os pontos já pesados (todos abaixo do peso), converte para 0 a 100.
    if (Object.keys(pesos).every(function (k) { return (notas[k] || 0) <= pesos[k]; }) && (x.score || 0) > 40) {
      Object.keys(pesos).forEach(function (k) { notas[k] = Math.round((notas[k] || 0) / pesos[k] * 100); });
    }
    [['Posicionamento', notas.posicionamento], ['Bio', notas.bio], ['Feed', notas.feed], ['Engajamento', notas.engajamento]].forEach(function (n) {
      var linha = el('div'); linha.appendChild(el('span', null, n[0]));
      var b = el('b'); var f = el('span'); f.style.width = Math.max(0, Math.min(100, n[1] || 0)) + '%'; b.appendChild(f); linha.appendChild(b);
      linha.appendChild(el('em', null, String(n[1] != null ? n[1] : '?'))); barras.appendChild(linha);
    });
    placar.appendChild(barras); sx.appendChild(placar);
    if (x.classificacao) sx.appendChild(el('p', 'faca', x.classificacao + (x.engajamento_percentual != null ? ' · engajamento de ' + String(x.engajamento_percentual).replace('.', ',') + '%' : '')));
    var lt = el('div', 'leitura'); (x.leitura || []).forEach(function (p) { lt.appendChild(el('p', null, p)); }); sx.appendChild(lt);
    if (x.bio_nova) {
      var cb = el('div', 'oferta'); cb.style.textAlign = 'left';
      cb.appendChild(el('p', 'olho', 'A sua bio nova, pronta para colar'));
      cb.appendChild(el('p', 'texto-pre', x.bio_nova)); cb.appendChild(botaoCopiar(x.bio_nova, 'Copiar a bio')); sx.appendChild(cb);
    }
    var gc = el('div', 'grade');
    (x.correcoes || []).forEach(function (c) {
