<style>
:root { --bg:#000; --card:#0b0b0b; --card2:#141414; --txt:#fff; --muted:#bdbdbd; --dim:#7f7f7f;

details p { margin-top:10px; }
.fixo { position:fixed; left:0; right:0; bottom:0; padding:10px 16px calc(10px + env(safe-area-inset-bottom)); background:rgba(0,0,0,.92); border-top:1px solid var(--bd2); display:none; z-index:5; }

@media (max-width:700px) { .fixo { display:block; } body { font-size:16.5px; } .sub { font-size:17.5px; } }
@media (min-width:701px) {
  main { max-width:960px; }
  section { align-items:center; text-align:center; }
  section > h1, section > h2 { max-width:800px; }

  .tira { justify-content:center; }

@media (prefers-reduced-motion:reduce) { * { transition:none !important; scroll-behavior:auto !important; } }

}
